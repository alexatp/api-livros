name: Create feature pull request

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request when needed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
            });

            if (pullRequests.length > 0) {
              core.info(`Pull request #${pullRequests[0].number} already exists.`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: `Feature: ${branch.replace(/^feature\//, '')}`,
              body: `Pull request automatically created after a push to \`${branch}\`.`,
            });

            core.info(`Created pull request #${pullRequest.number}: ${pullRequest.html_url}`);
